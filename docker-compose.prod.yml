services:
  db:
    image: postgres:16-alpine
    container_name: yuzu_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yuzu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yuzu_redis_prod
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: yuzu_ml_prod
    restart: always
    env_file:
      - path: ./ml_service/.env
        required: false
      - path: ./.env
        required: false
    environment:
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?ML_SERVICE_API_KEY must be set}
    expose:
      - "8001"
    volumes:
      - ml_cache_prod:/app/ml_service/.cache

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: yuzu_api_prod
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    expose:
      - "8000"
    volumes:
      - media_data_prod:/app/media
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (>= 32 chars)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${TRAEFIK_HOST}}
      CORS_ALLOW_ALL_ORIGINS: "False"
      USE_SQLITE: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?ML_SERVICE_API_KEY must be set}
      LOT_PARSER_BACKEND: ${LOT_PARSER_BACKEND:-apps.lots.integrations.ml.parser.MlServiceParser}
      CBRF_FALLBACK_RATES: ${CBRF_FALLBACK_RATES:-{"eur_rub":95.0,"usd_rub":85.0,"jpy_rub":0.5825,"cbrf_date":"12.11.2026"}}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Host: ${HEALTHCHECK_HOST:-localhost}' http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: yuzu_worker_prod
    restart: always
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    volumes:
      - media_data_prod:/app/media
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (>= 32 chars)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${TRAEFIK_HOST}}
      CORS_ALLOW_ALL_ORIGINS: "False"
      USE_SQLITE: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?ML_SERVICE_API_KEY must be set}
      LOT_PARSER_BACKEND: ${LOT_PARSER_BACKEND:-apps.lots.integrations.ml.parser.MlServiceParser}
      CBRF_FALLBACK_RATES: ${CBRF_FALLBACK_RATES:-{"eur_rub":95.0,"usd_rub":85.0,"jpy_rub":0.5825,"cbrf_date":"12.11.2026"}}
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib, sys; sys.exit(0 if any('celery' in p.read_bytes().decode('utf-8', 'ignore') for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')) else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: yuzu_beat_prod
    restart: always
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (>= 32 chars)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${TRAEFIK_HOST}}
      CORS_ALLOW_ALL_ORIGINS: "False"
      USE_SQLITE: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CBRF_FALLBACK_RATES: ${CBRF_FALLBACK_RATES:-{"eur_rub":95.0,"usd_rub":85.0,"jpy_rub":0.5825,"cbrf_date":"12.11.2026"}}
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_USE_MOCKS: ${PROD_VITE_USE_MOCKS:-false}
    container_name: yuzu_frontend_prod
    restart: always
    networks:
      - default
      - traefik-net
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.yuzu.rule=Host(`${TRAEFIK_HOST:?TRAEFIK_HOST must be set}`)"
      - "traefik.http.routers.yuzu.entrypoints=websecure"
      - "traefik.http.routers.yuzu.tls=true"
      - "traefik.http.routers.yuzu.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yuzu.priority=10"
      - "traefik.http.services.yuzu.loadbalancer.server.port=80"
    volumes:
      - media_data_prod:/app/media:ro
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: http://api:8000
      MEDIA_ROOT_DIR: /app/media
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:-localhost}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(wget -qO- --header='Host: ${HEALTHCHECK_HOST:-localhost}' http://127.0.0.1:80/healthz)\" = \"OK\" ] || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  traefik-net:
    external: true

volumes:
  postgres_data_prod:
  redis_data_prod:
  media_data_prod:
  ml_cache_prod:
