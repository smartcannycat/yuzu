services:
  db:
    image: postgres:16-alpine
    container_name: yuzu_db_prod
    restart: always
    networks:
      - backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yuzu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yuzu_redis_prod
    restart: always
    networks:
      - backend
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ \"$$(REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping)\" = \"PONG\" ] || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
      target: prod
    container_name: yuzu_ml_prod
    restart: always
    networks:
      - ml_internal
      - egress
    env_file:
      - path: ./ml_service/.env
        required: false
    environment:
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?ML_SERVICE_API_KEY must be set}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
    expose:
      - "8001"
    volumes:
      - ml_cache_prod:/app/ml_service/.cache

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: yuzu_api_prod
    restart: always
    networks:
      - edge
      - backend
      - ml_internal
    env_file:
      - path: ./.env
        required: false
    expose:
      - "8000"
    volumes:
      - media_data_prod:/app/media
      - private_intake_prod:/app/private_intake
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (>= 32 chars)}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set (>= 32 chars)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:-admin/}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${TRAEFIK_HOST}}
      CORS_ALLOW_ALL_ORIGINS: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      PRIVATE_INTAKE_ROOT: /app/private_intake
      ML_SERVICE_URL: http://ml:8001
      ML_SERVICE_TIMEOUT_SEC: ${ML_SERVICE_TIMEOUT_SEC:-65.0}
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?ML_SERVICE_API_KEY must be set}
      LOT_PARSER_BACKEND: ${LOT_PARSER_BACKEND:-ml}
      FARPOST_CAPTCHA_OCR_ENABLED: ${FARPOST_CAPTCHA_OCR_ENABLED:-true}
      CBRF_FALLBACK_RATES: ${CBRF_FALLBACK_RATES:-{"eur_rub":95.0,"usd_rub":85.0,"jpy_rub":0.5825,"cbrf_date":"14.11.2026"}}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Host: ${HEALTHCHECK_HOST:-${TRAEFIK_HOST:-localhost}}' http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: yuzu_worker_prod
    restart: always
    networks:
      - backend
      - ml_internal
      - egress
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - path: ./.env
        required: false
    volumes:
      - media_data_prod:/app/media
      - private_intake_prod:/app/private_intake
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (>= 32 chars)}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set (>= 32 chars)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${TRAEFIK_HOST}}
      CORS_ALLOW_ALL_ORIGINS: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      PRIVATE_INTAKE_ROOT: /app/private_intake
      ML_SERVICE_URL: http://ml:8001
      ML_SERVICE_TIMEOUT_SEC: ${ML_SERVICE_TIMEOUT_SEC:-65.0}
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:?ML_SERVICE_API_KEY must be set}
      LOT_PARSER_BACKEND: ${LOT_PARSER_BACKEND:-ml}
      FARPOST_CAPTCHA_OCR_ENABLED: ${FARPOST_CAPTCHA_OCR_ENABLED:-true}
      CBRF_FALLBACK_RATES: ${CBRF_FALLBACK_RATES:-{"eur_rub":95.0,"usd_rub":85.0,"jpy_rub":0.5825,"cbrf_date":"14.11.2026"}}
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib, sys; sys.exit(0 if any('celery' in p.read_bytes().decode('utf-8', 'ignore') for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')) else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: yuzu_beat_prod
    restart: always
    networks:
      - backend
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - path: ./.env
        required: false
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (>= 32 chars)}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set (>= 32 chars)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${TRAEFIK_HOST}}
      CORS_ALLOW_ALL_ORIGINS: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      CBRF_FALLBACK_RATES: ${CBRF_FALLBACK_RATES:-{"eur_rub":95.0,"usd_rub":85.0,"jpy_rub":0.5825,"cbrf_date":"14.11.2026"}}
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_USE_MOCKS: ${PROD_VITE_USE_MOCKS:-false}
    container_name: yuzu_frontend_prod
    restart: always
    networks:
      - edge
      - traefik-net
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.yuzu.rule=Host(`${TRAEFIK_HOST:?TRAEFIK_HOST must be set}`)"
      - "traefik.http.routers.yuzu.entrypoints=websecure"
      - "traefik.http.routers.yuzu.tls=true"
      - "traefik.http.routers.yuzu.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yuzu.priority=10"
      - "traefik.http.services.yuzu.loadbalancer.server.port=8080"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      API_UPSTREAM: http://api:8000
      ADMIN_PATH: ${ADMIN_PATH:-/admin*}
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:-${TRAEFIK_HOST:-localhost}}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(wget -qO- --header='Host: ${HEALTHCHECK_HOST:-${TRAEFIK_HOST:-localhost}}' http://127.0.0.1:8080/healthz)\" = \"OK\" ] || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  edge:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: true
  ml_internal:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  traefik-net:
    external: true

volumes:
  postgres_data_prod:
  redis_data_prod:
  media_data_prod:
  private_intake_prod:
  ml_cache_prod:
