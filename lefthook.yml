# Lefthook pre-commit hook configuration
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    oxfmt:
      root: "frontend/"
      glob: "*.{js,ts,vue,json,css,html,md}"
      exclude: "src/types/api.generated.ts"
      run: bun x oxfmt {staged_files}
      stage_fixed: true
    oxlint:
      root: "frontend/"
      glob: "*.{js,ts,vue}"
      run: bun x oxlint {staged_files}
    typecheck:
      root: "frontend/"
      glob: "*.{ts,vue}"
      run: bun run typecheck
    backend-ruff:
      root: "backend/"
      glob: "*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true
    backend-imports:
      root: "backend/"
      glob: "*.py"
      run: uv run lint-imports
    contracts-check:
      glob: "{backend/apps/**/api.py,backend/apps/**/api/**/*.py,backend/apps/**/schemas.py,backend/apps/**/controllers.py,backend/apps/core/enums.py,backend/config/api.py,backend/config/openapi.py,docs/architecture/openapi.json,frontend/src/types/api.generated.ts}"
      run: make check-contracts
    file-size-warn:
      glob: "*.{py,ts,vue}"
      exclude: "(^backend/apps/.*/migrations/|api\\.generated\\.ts$)"
      run: |
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          lines=$(wc -l < "$f")
          if [ "$lines" -gt 350 ]; then
            echo "WARNING: $f has $lines lines (soft limit 350 lines; consider splitting)."
          fi
        done
    ml-ruff:
      root: "ml_service/"
      glob: "*.py"
      run: uv run ruff check --fix {staged_files} && uv run ruff format {staged_files}
      stage_fixed: true
