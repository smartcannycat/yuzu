[project]
name = "yuzu-backend"
version = "0.1.0"
description = "Yuzu (AuctionCalc) REST API backend built with Django Ninja Extra, Granian, and Ruff"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.5.0",
    "cryptography>=44.0.0",
    "curl-cffi>=0.14.0",
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.3",
    "django-ninja-extra>=0.31.7",
    "django-ninja-jwt>=5.4.5",
    "granian[reload]>=2.8.7",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "scrapling>=0.5.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "lefthook>=2.2.2",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["config", "apps", "tests"]
force-exclude = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity
    "PERF",   # perflint
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "B008",   # Do not perform function calls in argument defaults
    "RUF001", # Allow Cyrillic characters in localized user-facing strings
    "RUF012", # Mutable class attributes should be annotated with typing.ClassVar
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.importlinter]
root_packages = ["apps", "config"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Core is independent of domain apps"
type = "forbidden"
source_modules = ["apps.core"]
forbidden_modules = ["apps.lots", "apps.users", "apps.integrations"]

[[tool.importlinter.contracts]]
name = "Lots models do not import API, pipeline, calculator, or integrations"
type = "forbidden"
source_modules = ["apps.lots.models"]
forbidden_modules = [
    "apps.lots.api",
    "apps.lots.pipeline",
    "apps.lots.calculator",
    "apps.lots.services",
    "apps.lots.lifecycle",
    "apps.lots.starter_lots",
    "apps.integrations",
]

[[tool.importlinter.contracts]]
name = "Integrations do not import lots pipeline, calculator, or API"
type = "forbidden"
source_modules = ["apps.integrations"]
forbidden_modules = [
    "apps.lots.api",
    "apps.lots.pipeline",
    "apps.lots.calculator",
    "apps.lots.services",
    "apps.lots.lifecycle",
    "apps.lots.media",
    "apps.lots.starter_lots",
]

[[tool.importlinter.contracts]]
name = "Calculator domain is independent of API, pipeline, and integrations"
type = "forbidden"
source_modules = ["apps.lots.calculator"]
forbidden_modules = [
    "apps.lots.api",
    "apps.lots.pipeline",
    "apps.lots.services",
    "apps.integrations",
]

[[tool.importlinter.contracts]]
name = "Pipeline does not import API controllers, schemas, or queries"
type = "forbidden"
source_modules = ["apps.lots.pipeline"]
forbidden_modules = [
    "apps.lots.api",
]

[[tool.importlinter.contracts]]
name = "Lots lifecycle is independent of API and integrations"
type = "forbidden"
source_modules = ["apps.lots.lifecycle"]
forbidden_modules = [
    "apps.lots.api",
    "apps.integrations",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.base"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --strict-markers"
