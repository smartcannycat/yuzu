server {
    listen 80;
    server_name _;

    client_max_body_size 160M;
    error_page 413 = @request_too_large;

    location @request_too_large {
        default_type application/problem+json;
        return 400 '{"type":"about:blank","title":"Некорректный запрос","status":400,"detail":"Превышен максимальный размер запроса","invalid_params":[],"timestamp":"$time_iso8601"}';
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
