# Default non-secret configuration for the Yuzu Django backend.
# Precedence (highest -> lowest): OS/Docker env -> .env -> config.toml -> Pydantic class defaults.
# Secrets, credentials, DB hosts, and deployment hostnames belong in root .env.
# Public source URLs (Aleado, CBRF, Drom, Farpost) live inside apps/integrations/* adapters.

[app]
environment = "local"       # Allowed: "local" | "dev" | "test" | "production"
debug = true
lot_parser_backend = "ml"   # Allowed: "ml" | "" (disabled) | "dotted.module.ClassName"
rate_limit_enabled = true
celery_task_always_eager = false
django_admin_url = "admin/"
admin_allowed_ips = []
private_intake_root = "private_intake"

[pipeline]
batch_item_concurrency = 4

[jwt]
access_token_lifetime_minutes = 60
refresh_token_lifetime_days = 7

[media]
url = "/media/"
root = "media"
purge_deleted_after_days = 7
purge_batch_originals_after_hours = 24

[ml_service]
url = "http://127.0.0.1:8001"  # Env-dependent ML service origin (Docker: http://ml:8001)
timeout_sec = 65.0

[scraper]
proxy_ban_sec = 120
timeout_sec = 10.0
request_interval_sec = 1.2
request_jitter_sec = 0.4

[farpost]
budget_sec = 30.0
cooldown_sec = 45
cache_ttl_hours = 24
captcha_max_attempts = 2
captcha_solve_budget_sec = 20.0
captcha_max_workers = 8
captcha_ocr_enabled = false
captcha_ocr_command = "tesseract"

[aleado]
timeout_sec = 20.0
request_interval_sec = 1.0
verify_candidates = 10
budget_sec = 25.0
ocr_max_workers = 3
search_cache_ttl_sec = 1800
detail_cache_ttl_sec = 604800
chassis_cache_ttl_sec = 2592000

[currency]
timeout_sec = 5.0
jpy_spread = 0.03
