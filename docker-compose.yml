services:
  db:
    image: postgres:16-alpine
    container_name: yuzu_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yuzu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yuzu_redis_dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: yuzu_ml_dev
    restart: unless-stopped
    env_file:
      - path: ./ml_service/.env
        required: false
    environment:
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-service-key}
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    volumes:
      - ml_cache_dev:/app/ml_service/.cache

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: yuzu_api_dev
    restart: unless-stopped
    command: ["granian", "--interface", "asginl", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-paths", "/app/apps", "--reload-paths", "/app/config"]
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/config:/app/config
      - ./backend/apps:/app/apps
      - ./backend/tests:/app/tests
      - media_data_dev:/app/media
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: local
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-yuzu-dev-secret-key-123456}
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,api,frontend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      USE_SQLITE: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-service-key}
      LOT_PARSER_BACKEND: ${LOT_PARSER_BACKEND:-apps.lots.integrations.ml.parser.MlServiceParser}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: yuzu_worker_dev
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/config:/app/config
      - ./backend/apps:/app/apps
      - media_data_dev:/app/media
    environment:
      ENVIRONMENT: local
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-yuzu-dev-secret-key-123456}
      USE_SQLITE: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-service-key}
      LOT_PARSER_BACKEND: ${LOT_PARSER_BACKEND:-apps.lots.integrations.ml.parser.MlServiceParser}
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib, sys; sys.exit(0 if any('celery' in p.read_bytes().decode('utf-8', 'ignore') for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')) else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: yuzu_beat_dev
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/config:/app/config
      - ./backend/apps:/app/apps
    environment:
      ENVIRONMENT: local
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-yuzu-dev-secret-key-123456}
      USE_SQLITE: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-yuzu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: yuzu_frontend_dev
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/vitest.config.ts:/app/vitest.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/env.d.ts:/app/env.d.ts
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
      DEV_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data_dev:
  redis_data_dev:
  media_data_dev:
  ml_cache_dev:
