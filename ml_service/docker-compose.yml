services:
  ml:
    build:
      context: .
      dockerfile: Dockerfile
    image: yuzu-ml-service:latest
    container_name: yuzu_ml_service
    ports:
      - "8001:8001"
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./.cache:/app/ml_service/.cache
    restart: unless-stopped
