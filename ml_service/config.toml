# Default non-secret configuration for yuzu-ml-service.
# Precedence (highest -> lowest): OS/Docker env -> .env -> config.toml -> Pydantic class defaults.
# Secrets (ML_SERVICE_API_KEY, GEMINI_API_KEYS) belong in root .env or standalone ml_service/.env.

[service]
default_auction_strictness = 0.65
rate_limit_requests_per_minute = 600
pre_auth_rate_limit_requests_per_minute = 1200
enable_docs = false
cors_allowed_origins = []
max_image_size_mb = 15
http_timeout_seconds = 20.0
cache_dir = ".cache/sheets"
cache_ttl_seconds = 604800.0
cache_max_disk_mb = 512
# reference_year and reference_month default dynamically to Asia/Tokyo (JST) when omitted.

[gemini]
decision_model = "gemini-decision-1"
flash_model = "gemini-3.6-flash"
fallback_models = [
  "gemini-3-flash-preview",
  "gemini-3.7-flash",
  "gemini-3.8-flash",
  "gemini-3.5-flash",
  "gemini-3.5-flash-lite",
]
enable_gatekeeper = true
enable_fast_header = false
gatekeeper_fail_open = true
gatekeeper_sheet_threshold = 0.60
gatekeeper_readable_threshold = 0.50
rpm_limit = 5
request_timeout_ms = 25000
sdk_max_attempts = 1
model_cooldown_seconds = 120.0
client_error_cooldown_seconds = 300.0
key_cooldown_seconds = 30.0
max_key_tries = 3
thinking_level = "LOW"             # Allowed: "MINIMAL" | "LOW" | "MEDIUM" | "HIGH"
request_deadline_seconds = 45.0
hedge_delay_seconds = 8.0
fast_header_timeout_seconds = 1.2

[batch]
poll_interval_ms = 1500
max_items = 10
max_concurrency = 3
max_stored_batches = 200
ttl_seconds = 1800.0
max_queued_bytes = 268435456

[crop]
format = "JPEG"                   # Allowed: "JPEG" | "PNG" | "WEBP"
quality = 88
min_px = 1000
max_px = 1400

[chassis_ocr]
local_enabled = true
local_command = "tesseract"
local_min_confidence = 80.0
local_timeout_seconds = 5.0
